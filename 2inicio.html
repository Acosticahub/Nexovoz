<!DOCTYPE html>

</header>

<!-- MENU -->
<section class="menu">

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">

        <img class="perfil" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

        <input type="text" placeholder="Editar nombre">
        <input type="email" placeholder="Editar correo">
        <input type="password" placeholder="Editar contraseña">

        <button onclick="cerrarModal()">Volver al menú</button>

    </div>
</div>

<script>
function cerrarModal(){
    document.getElementById("modal").style.display = "none";
}

document.getElementById("userBtn").onclick = function(){
    document.getElementById("modal").style.display = "flex";
}
</script>
