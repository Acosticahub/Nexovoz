<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foro - NEXOVOZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(140deg, #071a4e 0%, #0d2f6e 45%, #0a3d1f 100%);
    min-height: 100vh;
    color: white;
}

/* ── NAVBAR ── */
.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 36px;
    background: rgba(0,0,0,0.18);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 20;
}

.nav-logo {
    width: 50px; height: 50px;
    border-radius: 50%; border: 2.5px solid #7dd63b;
    overflow: hidden; background: white;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
}
.nav-logo img { width: 100%; height: 100%; object-fit: cover; }
.nav-logo-txt { font-size: 10px; font-weight: 800; color: #0d2060; text-align: center; line-height: 1.2; }

.nav-center { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }

.nav-right { display: flex; align-items: center; gap: 10px; }

.btn-volver {
    background: rgba(255,255,255,0.15);
    color: white; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 30px; padding: 8px 18px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    text-decoration: none; font-family: 'Poppins', sans-serif;
    transition: background 0.2s;
}
.btn-volver:hover { background: rgba(255,255,255,0.28); }

/* ── PAGE HEADER ── */
.page-header {
    padding: 28px 36px 10px;
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.page-header h1 { font-size: 28px; font-weight: 800; }
.page-header p  { color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 4px; }
.post-count {
    background: #7dd63b; color: #0d2060;
    border-radius: 20px; padding: 5px 16px;
    font-size: 13px; font-weight: 700;
    white-space: nowrap;
}

/* ── COMPOSE BOX ── */
.compose-wrap {
    padding: 16px 36px 20px;
}
.compose-box {
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(125,214,59,0.35);
    border-radius: 22px;
    padding: 18px 20px;
    display: flex; flex-direction: column; gap: 12px;
    backdrop-filter: blur(8px);
    max-width: 800px;
}
.compose-box textarea {
    width: 100%; background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 14px 18px;
    font-size: 14px; color: white; outline: none; resize: none;
    font-family: 'Poppins', sans-serif; line-height: 1.6;
    min-height: 80px;
    transition: border-color 0.2s;
}
.compose-box textarea::placeholder { color: rgba(255,255,255,0.45); }
.compose-box textarea:focus { border-color: #7dd63b; }

.compose-footer {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
.char-count { font-size: 12px; color: rgba(255,255,255,0.45); }
.char-count.warn { color: #ffb347; }
.char-count.over { color: #ff6b6b; }

.btn-send {
    background: #7dd63b; color: #0d2060;
    border: none; border-radius: 20px;
    padding: 10px 28px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: 'Poppins', sans-serif;
    transition: background 0.2s, transform 0.15s;
    display: flex; align-items: center; gap: 7px;
}
.btn-send:hover { background: #8fe84e; transform: translateY(-1px); }
.btn-send:active { transform: scale(0.97); }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ── DIVIDER ── */
.section-divider {
    padding: 0 36px 16px;
    display: flex; align-items: center; gap: 12px;
}
.section-divider span { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.5); white-space: nowrap; }
.section-divider hr { flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.12); }

/* ── POSTS LIST ── */
.posts-wrap {
    padding: 0 36px 60px;
    display: flex; flex-direction: column; gap: 14px;
    max-width: 800px;
}

.post-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 18px 20px;
    backdrop-filter: blur(6px);
    animation: fadeUp 0.3s ease both;
    transition: border-color 0.2s;
}
.post-card:hover { border-color: rgba(125,214,59,0.3); }

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
}

.post-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
}

.avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #0039a6, #7dd63b);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: white; flex-shrink: 0;
}

.post-meta { flex: 1; }
.post-autor { font-size: 14px; font-weight: 700; color: white; }
.post-fecha { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }

.post-body {
    font-size: 14px; line-height: 1.65; color: rgba(255,255,255,0.88);
    word-break: break-word;
}

.post-actions {
    display: flex; align-items: center; gap: 16px; margin-top: 14px;
}

.btn-like {
    background: none; border: none; color: rgba(255,255,255,0.45);
    font-size: 12px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    font-family: 'Poppins', sans-serif; padding: 0;
    transition: color 0.15s;
}
.btn-like:hover { color: #ff6b9d; }
.btn-like.liked { color: #ff6b9d; }
.btn-like svg { width: 14px; height: 14px; }

.btn-expand {
    background: none; border: none;
    color: #7dd63b; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: 'Poppins', sans-serif; padding: 0;
    transition: color 0.15s;
}
.btn-expand:hover { color: #8fe84e; }

/* ── EMPTY STATE ── */
.empty-state {
    text-align: center; padding: 50px 20px; color: rgba(255,255,255,0.4);
}
.empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; font-weight: 600; }
.empty-state small { font-size: 13px; display: block; margin-top: 6px; }

/* ── TOAST ── */
.toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: #7dd63b; color: #0d2060;
    border-radius: 30px; padding: 12px 28px;
    font-size: 14px; font-weight: 700;
    opacity: 0; transition: all 0.3s ease; z-index: 200;
    pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── RESPONSIVE ── */
@media (max-width: 720px) {
    .navbar { padding: 14px 18px; }
    .page-header { padding: 20px 18px 10px; }
    .compose-wrap { padding: 12px 18px 16px; }
    .section-divider { padding: 0 18px 12px; }
    .posts-wrap { padding: 0 18px 50px; }
    .nav-center { display: none; }
}

</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="/Nexovoz/pages/nexovozinicio.html" class="nav-logo" title="NEXOVOZ">
        <img src="../assets/img/logo.png" alt="NEXOVOZ"
             onerror="this.style.display='none';this.nextSibling.style.display='flex'">
        <span class="nav-logo-txt" style="display:none;">NEXO<br>VOZ</span>
    </a>

    <div class="nav-center">Foro comunitario</div>

    <div class="nav-right">
        <a href="/Nexovoz/pages/nexovozinicio.html" class="btn-volver">&#8592; Volver</a>
        <button id="avatarBtn" class="nav-avatar-global" title="Mi perfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" width="22" height="22"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </button>
    </div>
</nav>

<!-- HEADER -->
<div class="page-header">
    <div>
        <h1>Foro</h1>
        <p>Comparte tu experiencia y conecta con la comunidad NEXOVOZ</p>
    </div>
    <div class="post-count" id="postCount">0 mensajes</div>
</div>

<!-- COMPOSE -->
<div class="compose-wrap">
    <div class="compose-box">
        <textarea id="composeInput" placeholder="Escribe tu mensaje, pregunta o experiencia..." maxlength="600"></textarea>
        <div class="compose-footer">
            <span class="char-count" id="charCount">0 / 600</span>
            <button class="btn-send" id="btnSend" onclick="enviar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16" stroke-linecap="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
                Publicar
            </button>
        </div>
    </div>
</div>

<!-- DIVIDER -->
<div class="section-divider">
    <span>Mensajes recientes</span>
    <hr>
</div>

<!-- POSTS -->
<div class="posts-wrap" id="postsWrap"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

var posts = [];
var likes = {};
var expanded = {};
var MAX = 600;

document.getElementById('composeInput').addEventListener('input', function() {
    var len = this.value.length;
    var cc  = document.getElementById('charCount');
    cc.textContent = len + ' / ' + MAX;
    cc.className = 'char-count' + (len > MAX * 0.9 ? (len >= MAX ? ' over' : ' warn') : '');
});

function iniciales(n) {
    if (!n) return '?';
    return n.trim().split(' ').map(function(p) { return p[0]; }).join('').slice(0, 2).toUpperCase();
}

function formatFecha(str) {
    if (!str) return '';
    var d = new Date(str.replace(' ', 'T'));
    if (isNaN(d)) return str;
    return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' })
         + ' · ' + d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
}

function render() {
    var wrap = document.getElementById('postsWrap');
    document.getElementById('postCount').textContent = posts.length + (posts.length === 1 ? ' mensaje' : ' mensajes');

    if (!posts.length) {
        wrap.innerHTML = '<div class="empty-state"><div class="emoji">💬</div><p>No hay mensajes aun</p><small>Se el primero en publicar algo</small></div>';
        return;
    }

    wrap.innerHTML = posts.map(function(p, i) {
        var texto = p.texto || '';
        var corto = texto.length > 220;
        var txt   = (expanded[i] || !corto) ? texto : texto.slice(0, 220) + '...';
        var liked = !!likes[i];
        var lc    = likes[i] || 0;

        return '<div class="post-card" style="animation-delay:' + (i * 0.05) + 's">' +
            '<div class="post-header">' +
                '<div class="avatar">' + iniciales(p.autor) + '</div>' +
                '<div class="post-meta">' +
                    '<div class="post-autor">' + escHtml(p.autor || 'Anonimo') + '</div>' +
                    '<div class="post-fecha">' + formatFecha(p.fecha) + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="post-body">' + escHtml(txt) + '</div>' +
            '<div class="post-actions">' +
                '<button class="btn-like' + (liked ? ' liked' : '') + '" onclick="toggleLike(' + i + ')">' +
                    '<svg viewBox="0 0 24 24" fill="' + (liked ? '#ff6b9d' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' +
                    (lc > 0 ? lc : '') +
                '</button>' +
                (corto ? '<button class="btn-expand" onclick="toggleExpand(' + i + ')">' + (expanded[i] ? 'Ver menos' : 'Leer mas') + '</button>' : '') +
            '</div>' +
        '</div>';
    }).join('');
}

function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
}

function toggleLike(i) {
    if (likes[i]) {
        likes[i] = 0;
    } else {
        likes[i] = 1;
    }
    render();
}

function toggleExpand(i) {
    expanded[i] = !expanded[i];
    render();
}

function cargarMensajes() {
    fetch('../backend/mostrar_foro.php')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            posts = data.map(function(m) {
                return { autor: m.nombre || 'Anonimo', texto: m.mensaje, fecha: m.fecha };
            });
            render();
        })
        .catch(function() {
            document.getElementById('postsWrap').innerHTML =
                '<div class="empty-state"><div class="emoji">⚠️</div><p>No se pudieron cargar los mensajes</p><small>Verifica tu conexion</small></div>';
        });
}

function enviar() {
    var inp = document.getElementById('composeInput');
    var txt = inp.value.trim();
    if (!txt) { inp.focus(); return; }
    if (txt.length > MAX) { mostrarToast('El mensaje es demasiado largo.'); return; }

    var btn = document.getElementById('btnSend');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    var datos = new FormData();
    datos.append('mensaje', txt);

    fetch('../backend/foro.php', { method: 'POST', body: datos })
        .then(function(r) { return r.text(); })
        .then(function(resp) {
            if (resp.trim() === 'ok') {
                inp.value = '';
                document.getElementById('charCount').textContent = '0 / ' + MAX;
                document.getElementById('charCount').className = 'char-count';
                expanded = {};
                cargarMensajes();
                mostrarToast('Mensaje publicado');
            } else {
                mostrarToast('Error al publicar. Intenta de nuevo.');
            }
        })
        .catch(function() { mostrarToast('Error de conexion.'); })
        .finally(function() {
            btn.disabled = false;
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Publicar';
        });
}

function mostrarToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2800);
}

document.getElementById('composeInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); enviar(); }
});

cargarMensajes();

</script>
<script src="../assets/js/navbar-avatar.js"></script>
</body>
</html>
